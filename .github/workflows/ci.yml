name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # usado pelo release.yml antes de publicar

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão mínima suportada (go.mod); os jobs também rodam na última estável.
  GO_MIN: "1.26.x"

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_MIN }}
      - name: go mod tidy sem diferenças
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (inclui gofmt e goimports)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    name: Testes (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x"]
        include:
          - os: ubuntu-latest
            go: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      # O texto dos PDFs é verificado com o pdftotext e o pdfinfo (poppler),
      # obrigatórios nos três sistemas.
      - name: Instalar poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Instalar poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      # O Git for Windows já traz um pdftotext antigo, mas não o pdfinfo; a pasta
      # do poppler vai para o início do PATH para que as duas ferramentas
      # venham da mesma instalação.
      - name: Instalar poppler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler --no-progress -y
          $bin = Get-ChildItem C:\ProgramData\chocolatey\lib\poppler -Recurse -Filter pdfinfo.exe | Select-Object -First 1
          if (-not $bin) { throw "pdfinfo.exe não encontrado depois de instalar o poppler" }
          $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin.DirectoryName pdftotext.exe) -v
      - name: Exigir poppler
        shell: bash
        run: echo "CV_CRAFT_REQUIRE_POPPLER=1" >> "$GITHUB_ENV"

      - name: Testes com race detector e cobertura
        if: runner.os != 'Windows'
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Testes
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

      - name: Cobertura mínima de 80% em internal/
        if: runner.os == 'Linux' && matrix.go != 'stable'
        run: scripts/coverage.sh coverage.out 80
      - name: Publicar relatório de cobertura
        if: runner.os == 'Linux' && matrix.go != 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Smoke test do binário
        shell: bash
        run: scripts/smoke.sh

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_MIN }}
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .

  vulncheck:
    name: Vulnerabilidades (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docs:
    name: Documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_MIN }}
      # Inclui os golden files de Markdown, que são a saída gerada a partir de
      # examples/ (spec 004 FR-MD-5).
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.3
      - name: Comandos da documentação
        run: scripts/doc-commands.sh
      - name: Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-check:
    name: Release (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: goreleaser check + snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Conferir arquivos e versão embutida
        run: scripts/check-release.sh dist
