name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI completo
    uses: ./.github/workflows/ci.yml

  release:
    name: Publicar release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a release e anexar os binários
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o changelog precisa do histórico e das tags
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
