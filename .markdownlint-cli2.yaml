# Lint de Markdown (spec 004 FR-MD-5, spec 008). Roda no CI (job "docs") e
# com "make docs". Os golden files em internal/generator/testdata/ são a saída
# Markdown gerada a partir de examples/, então também são verificados aqui.
config:
  MD013: false # tamanho de linha: textos longos são esperados
  MD060: false # estilo de espaçamento do separador de tabela (|---|)
  MD024:
    siblings_only: true # o CHANGELOG repete "Adicionado"/"Alterado" em cada versão
  MD033:
    allowed_elements: [p, img, details, summary] # prévia centralizada e seções recolhíveis no README
globs:
  - "**/*.md"
ignores:
  - ".claude/**"
  - "node_modules/**"
  - "dist/**"
