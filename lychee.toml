# Verificação de links da documentação (spec 008 FR-4). Roda no CI (job "docs").
# Links dentro de blocos de código não são verificados (padrão do lychee), então
# os dados fictícios dos exemplos YAML não geram falsos positivos.

exclude_path = [
  "internal/generator/testdata", # saídas geradas com dados fictícios
  ".claude",
  "node_modules",
  "dist",
]

exclude = [
  '^https?://(www\.)?linkedin\.com', # bloqueia robôs (HTTP 999)
  '^mailto:',
  # Links de versão do CHANGELOG: só existem depois que o dono cria a tag, que vem
  # após o merge do PR de fechamento da fase.
  '^https://github\.com/fabiodrneles/cv-craft/(compare|releases/tag)/',
]

# Links para issues/PRs e para o próprio repositório: o GitHub limita requisições
# anônimas; com GITHUB_TOKEN no CI elas passam.
max_retries = 3
accept = ["200..=299", "429"]
